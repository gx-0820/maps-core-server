syntax = "proto3";

import "common.proto";

option java_multiple_files = true;
option java_package = "com.example.coreserver.grpc.config";
option java_outer_classname = "ConfigProto";

package config;

// Device configuration service
service ConfigService {
  // Get current configuration
  rpc GetConfig (common.Empty) returns (DeviceConfig) {}
  
  // Update configuration
  rpc UpdateConfig (DeviceConfig) returns (common.Response) {}
  
  // Add multiple devices
  rpc AddDevices (DeviceConfig) returns (common.Response) {}
  
  // Add single device
  rpc AddDevice (Device) returns (common.Response) {}
  
  // Remove device
  rpc RemoveDevice (common.DeviceId) returns (common.Response) {}
}

// Device configuration
message Device {
  optional string device_id = 1;
  optional string device_name = 2;
  optional string device_type = 3;
  optional string ip_address = 4;
  optional int32 port = 5;
  optional string protocol_type = 6;
  optional string main_stream_url = 7;
  optional string visible_light_url = 8;
  optional string username = 9;
  optional string password = 10;
  optional string api_base_url = 11;
  optional string sub_stream_url = 12;
}

// Device configuration list
message DeviceConfig {
  repeated Device devices = 1;
}
