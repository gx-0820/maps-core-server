syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.coreserver.grpc.common";
option java_outer_classname = "CommonProto";

package common;

message Empty {}

message Response {
  bool success = 1;
  string message = 2;
}

message DeviceId {
  string device_id = 1;
} 